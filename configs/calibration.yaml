# 用法:
#   ./build/calibrate configs/calibration.yaml
#   ./build/calibrate configs/calibration.yaml -o configs/camera/sentry.yaml
#   ./build/calibrate configs/calibration.yaml --camera-only
# 挥动棋盘格填满 X/Y/Size/Skew 后按 C 标定，S 保存到 camera_dir 下同名文件。

# 棋盘格内角点数量
pattern_cols: 11
pattern_rows: 8
# 方格实际尺寸(毫米)，用于计算相机内参
square_size_mm: 40

#####-----相机参数-----#####
camera_dir: configs/camera

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"

#####-----remote_logger-----#####
remote_logger:
  control_port: 15000
  enable_remote: true
  enable_local: true
  log_dir: "./logs"
  var_buffer_size: 1024
  img_buffer_size: 10
  img_width: 640
  img_quality: 50
  heartbeat_interval_ms: 500
  sender_name: "calibrate"
  beacon_interval_ms: 1000
  head_timeout_ms: 2000
