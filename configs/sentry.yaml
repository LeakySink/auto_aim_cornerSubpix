enemy_color: "blue"
#####-----神经网络参数-----#####
yolo_name: tup
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
tup_model_path: assets/opt-1208-001.xml
device: CPU
min_confidence: 0.8
#####-----检测结果发布（调试）-----#####
publish_detections: true
publish_image_name: "tup_detect"

save_detection_frames: 10
use_traditional: true
#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false
#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25
#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
outpost_give_up_frames: 300
outpost_discriminate_ratio: 0.5
#####-----EKF参数-----#####
ekf:
  # ⚠️ 2026-11 状态模型改为 14 维 CA（常加速）后，本参数含义已变：
  #   CA 下 = jerk（加加速度）方差 [m²/s⁶]，不再是加速度方差 [m²/s⁴]。
  #
  # 纯匀速圆周工况下的外推误差实测（.deps/diag_ca.cpp，噪声 2mm）：
  #   q=1   前哨站 0.8mm@0.25s / 小陀螺w=5 4.7mm / w=10 1.5mm
  #   q=10  前哨站 1.5mm       / 小陀螺w=5 6.1mm / w=10 1.6mm
  #   q=70  前哨站 13.5mm      / 小陀螺w=5 5.8mm / w=10 3.8mm
  #   q=500 前哨站 27.9mm      / 小陀螺w=5 10.2mm/ w=10 9.5mm
  #   （对照：旧 CV 模型的理论误差 前哨站 55mm / w=5 156mm / w=10 625mm）
  #
  # 注意：上表是"模型完美匹配真值"的理想工况，q 越小必然越好。
  # 真实目标 = 圆周 + 噪声 + 机动，q 太小会跟不上机动。
  #
  # 2026-11 由 70 改为 10：前哨站中心是**固定道具**（v=a=0 是硬约束），
  # 不存在"机动"需要更大的 q 去跟；q 越大只会让加速度状态去吸收噪声。
  # 换车/换打法后需重新标定。
  q_xyz_acc_var: 10.0
  q_yaw_acc_var: 100.0
  q_geo: 0.0
  omega_freeze_thresh: 0.5
  r_yaw: 5e-3
  r_pitch: 2e-3
  r_dist_base: 2e-1
  # 距离通道方差 [m²]（R 的第 3 个对角元）。
  # 实测标定（实机 rlog，前哨站 @4.4 m，同板相邻帧差分，三份 log 一致）：
  #   σ_d ≈ 51~56 mm（中位 |Δd| 79 mm / √2），重尾 p90 = 360 mm
  # 取 5e-3（σ ≈ 71 mm，留 ~1.3 倍余量）。
  #
  # ⚠️ 旧的隐式公式 `(log|Δangle|+1)·view_penalty` 实算 **1.4~3.5 m²
  #   （σ = 1.2~1.9 m）**，比实测大 10~25 倍 —— 后果是新息门控（χ²=18.47）
  #   恒不触发，1 m 以上的距离离群观测照单全收。
  # ⚠️ 别填得过紧：σ 取 16 mm 会让门控持续触发、帧丢光。
  #
  # **判据**：改完 `nis` 均值应向 4 收敛（4 维观测的理论期望）；
  #   改之前实测 1.1，说明 R 整体过保守约 3.5 倍、门控全空转。
  r_dist: 5e-3

  outpost:
    radius: 0.2765
    armor_num: 3
    p0: [1, 64, 1, 64, 1, 81, 0.4, 100, 1.0e-4, 0, 1.0e-3]

  base:
    radius: 0.3205
    armor_num: 3
    p0: [1, 64, 1, 64, 1, 64, 0.4, 100, 1.0e-4, 0, 0]

  normal:
    radius: 0.2
    armor_num: 4
    p0: [1, 64, 1, 64, 1, 64, 0.4, 400, 1.0e-5, 0.3, 0.3]
#####-----aimer参数-----#####
