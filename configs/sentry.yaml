enemy_color: "blue"
#####-----神经网络参数-----#####
yolo_name: tup
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
tup_model_path: assets/opt-1208-001.xml
device: CPU
min_confidence: 0.8
#####-----检测结果发布（调试）-----#####
publish_detections: true
publish_image_name: "tup_detect"

save_detection_frames: 10
use_traditional: true
#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false
#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25
#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
#####-----EKF参数-----#####
ekf:
  q_xyz_acc_var: 70.0
  q_yaw_acc_var: 100.0
  q_geo: 0.0
  omega_freeze_thresh: 0.5
  r_yaw: 5e-3
  r_pitch: 2e-3
  r_dist_base: 2e-1

  outpost:
    radius: 0.2765
    armor_num: 3
    p0: [1, 64, 1, 64, 1, 81, 0.4, 100, 1.0e-4, 0, 1.0e-3]

  base:
    radius: 0.3205
    armor_num: 3
    p0: [1, 64, 1, 64, 1, 64, 0.4, 100, 1.0e-4, 0, 0]

  normal:
    radius: 0.2
    armor_num: 4
    p0: [1, 64, 1, 64, 1, 64, 0.4, 400, 1.0e-5, 0.3, 0.3]
#####-----aimer参数-----#####
yaw_offset: -2
pitch_offset: 1.72
comming_angle: 55
leaving_angle: 20
decision_speed: 7
high_speed_delay_time: 0.065
low_speed_delay_time: 0.055
#####-----离线回放/评估（默认关）-----#####
publish_raw_frame: false
#####-----装甲板几何（1月中旬换样式只改这里）-----#####
armor_geometry:
  small_width: 0.135
  big_width: 0.230
  lightbar_length: 0.056
  tilt_deg: 15.0
  outpost_tilt_deg: -15.0
  thickness: 0.01

reject_bad_keypoints: false
#####-----弹道模型-----#####
ballistics_model: poly

ballistics_csv: assets/ballistic/small.csv

ballistics_x_range: [0.5, 15.0]
ballistics_y_range: [-2.0, 2.0]
#####-----重装自瞄：瞄中心 + 等板转过来开火-----#####
center_aim:
  hit_margin: 0.30
  min_face_cos: 0.15
  pitch_follow_plate: true
  gimbal_tol_deg: 0.5
  require_settled: true
  max_iter: 6
  launch_delay: 0.0
  heat:
    enabled: true
    limit: 300
    cool_rate: 100
    shot_cost: 100
    reserve: 0
    settle_hz: 10
    shots_per_pulse: 1

min_valid_dist: 0.5
max_valid_dist: 50.0
#####-----shooter参数-----#####
first_tolerance: 3
second_tolerance: 2
judge_distance: 2
auto_fire: true

camera_name: "hikrobot"
exposure_ms: 10
gain: 16
vid_pid: "2bdf:0001"
#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

calibrated_at: "2026-10-01"

camera_matrix: [1817.806292,0.000000,704.048819,0.000000,1819.072108,545.80138,0.000000,0.000000,1.000000]
distort_coeffs: [-0.068754,0.162100,-0.001822,-0.001524,0.000000]

R_camera2gimbal: [0,0,1,-1,0,0,0,-1,0]
t_camera2gimbal: [0.1600, 0.04525, 0.003]
#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"
#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0
#####-----planner-----#####
fire_thresh: 0.15

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]
#####-----remote_logger-----#####
remote_logger:
  control_port: 15000
  enable_remote: true
  enable_local: true
  log_dir: "./logs"
  var_buffer_size: 1024
  img_buffer_size: 10
  img_width: 640
  img_quality: 50
  heartbeat_interval_ms: 500
  sender_name: "bingbing"
  beacon_interval_ms: 1000
  head_timeout_ms: 2000
