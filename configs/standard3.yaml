second_tolerance: 2
judge_distance: 2
auto_fire: true

camera_name: "hikrobot"
exposure_ms: 2
gain: 15
vid_pid: "2bdf:0001"

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

camera_matrix:   [2366.5332865081705, 0.0, 745.1877159202239, 0.0, 2363.3474547426426, 550.4481598011731, 0.0, 0.0, 1.0]
