min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75
#####-----EKF参数-----#####
ekf:
  q_xyz_acc_var: 100.0
  q_yaw_acc_var: 75.0
  r_yaw: 4.0e-2
  r_pitch: 4.0e-2
  r_dist_base: 1.5e-2

